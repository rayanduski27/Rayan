name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: rayan123
      BUBBLEWRAP_KEY_PASSWORD: rayan123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias rayan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rayan123 -keypass rayan123 -dname "CN=Rayan"
      - name: Build APK
        run: |
          yes | bubblewrap doctor || true
          bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: rayan-apk
          path: '*.apk'
